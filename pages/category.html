<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explora películas por categoría · CINEHUB" />
    <title>Categorías · CINEHUB</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../css/variables.css?v=5" />
    <link rel="stylesheet" href="../css/main.css?v=5" />
    <link rel="stylesheet" href="../css/components.css?v=5" />
    <link rel="stylesheet" href="../css/listing.css?v=5" />
    <link rel="stylesheet" href="../css/responsive.css?v=5" />
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>

    <site-header active="categories"></site-header>

    <main id="main" class="listing-page">
      <div class="container listing-head">
        <h1 class="listing-title" id="listing-title">Categorías</h1>

        <div class="listing-sort">
          <label for="sort-select">Ordenar por</label>
          <select id="sort-select">
            <option value="relevance">Relevancia</option>
            <option value="az">Título · A–Z</option>
            <option value="za">Título · Z–A</option>
            <option value="rating-desc">Mejor valoradas</option>
            <option value="rating-asc">Peor valoradas</option>
          </select>
        </div>
      </div>

      <nav class="genre-chips container" id="genre-chips" aria-label="Categorías">
        <span class="state state--loading">Cargando categorías…</span>
      </nav>

      <div class="movie-grid container" id="results-grid" data-state="loading">
        <p class="state state--loading">Cargando películas…</p>
      </div>
    </main>

    <site-footer></site-footer>

    <script type="module" src="../js/modules/category.js"></script>
  </body>
</html>
