<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Crea tu cuenta en CINEHUB" />
    <title>Crear cuenta · CINEHUB</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>

    <site-header active=""></site-header>

    <main id="main" class="auth-page">
      <div class="auth-card">
        <h1 class="auth-card__title">Crear cuenta</h1>
        <p class="auth-card__subtitle">Únete a CINEHUB en unos segundos.</p>

        <form id="register-form" novalidate>
          <div class="field">
            <label class="field__label" for="reg-name">Nombre</label>
            <input class="field__control" type="text" id="reg-name" name="name" autocomplete="name" required />
          </div>

          <div class="field">
            <label class="field__label" for="reg-email">Correo</label>
            <input class="field__control" type="email" id="reg-email" name="email" autocomplete="email" required />
          </div>

          <div class="field">
            <label class="field__label" for="reg-password">Contraseña <span class="field__optional">(mín. 6)</span></label>
            <input class="field__control" type="password" id="reg-password" name="password" autocomplete="new-password" minlength="6" required />
          </div>

          <div class="field">
            <label class="field__label" for="reg-confirm">Repite la contraseña</label>
            <input class="field__control" type="password" id="reg-confirm" name="confirm" autocomplete="new-password" required />
          </div>

          <p class="auth-feedback" id="auth-feedback" role="alert"></p>

          <button type="submit" class="button button--primary auth-submit">Crear cuenta</button>
        </form>

        <p class="auth-alt">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
      </div>
    </main>

    <site-footer></site-footer>

    <script type="module" src="../js/modules/register.js"></script>
  </body>
</html>
